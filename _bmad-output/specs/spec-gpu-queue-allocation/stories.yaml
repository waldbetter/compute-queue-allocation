# ===== Epic 3: 排队与分配（核心） =====
- id: "3-1"
  title: 任务提交 API 与校验
  description: >-
    POST /tasks；gpu_count==1 校验；QUEUED 状态；queue_position 即时计算。
  spec_checkpoint: false
  done_checkpoint: false

- id: "3-2"
  title: 任务列表与详情
  description: >-
    GET /tasks（当前用户）/tasks/admin（全部）；GET /tasks/{id} 含 queue_position。
  spec_checkpoint: false
  done_checkpoint: false

- id: "3-3"
  title: FCFS 调度器 asyncio Task
  description: >-
    dispatcher.py run_dispatcher()；完整 AD-1 事务 SQL（FOR UPDATE 必须执行）；
    主循环 ≤ 500ms；subprocess 启动。
  spec_checkpoint: true
  done_checkpoint: false
  invoke_dev_with: >-
    这是整个 MVP 的心脏。先写单元测试（pytest-asyncio）再实现；
    FOR UPDATE + 事务逻辑必须单独提取成 try_allocate_gpu() 方法方便 mock 测试；
    失败时 Log 1205 Lock wait timeout 并返回 409。

- id: "3-4"
  title: 并发分配安全单元测试
  description: >-
    真实 MySQL（Testcontainers）；1 张 IDLE GPU + N=50/100 并发；验证仅 1 条 ALLOCATE 日志。
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    使用 Testcontainers Python 启动一次性 MySQL；必须验证事务回滚完整性。

- id: "3-5"
  title: subprocess 执行与监控
  description: >-
    ProcessManager：asyncio.create_subprocess_exec；
    CUDA_VISIBLE_DEVICES 注入；日志写 logs/{task_id}.log；exit code 处理。
  spec_checkpoint: false
  done_checkpoint: false

- id: "3-6"
  title: 任务取消与终止
  description: >-
    POST /tasks/{id}/cancel（owner，QUEUED/PENDING）；
    POST /tasks/{id}/terminate（admin，任意状态）；SIGTERM / Windows taskkill。
  spec_checkpoint: false
  done_checkpoint: false

- id: "3-7"
