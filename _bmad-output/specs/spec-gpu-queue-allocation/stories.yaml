- id: "3-9"
  title: 多卡同型号分配（Post-MVP 增强）
  description: >-
    gpu_count 放开为 1-N（上限 64）。调度器按任务型号偏好（未填则以最早空闲卡
    型号为基准）一次性 SELECT ... FOR UPDATE 锁 N 张同型号 IDLE 卡；凑不齐则
    队首阻塞保持排队（保 FCFS 语义，不做跨型号混搭）。CUDA_VISIBLE_DEVICES
    注入逗号串（如 "1,2"）；GPU.current_task_id 多行指向同一任务，完成/终止/
    启动失败均按 current_task_id 批量释放。
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    最简实现：tasks 表新增 allocated_gpu_ids VARCHAR(64) 记录逗号串；
    不引入 task_gpus 关联表；释放统一走 GPU.current_task_id 查询。

